<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIGMA FLEET · one row per lung</title>
<style>
  :root{
    --bg:#0b0f0d; --panel:#121815; --panel2:#0e1411; --line:#1e2a24;
    --fg:#d6e3d8; --dim:#7d9185; --faint:#4c5f55;
    --ok:#34d17b; --warn:#e5b83b; --bad:#e5533d; --accent:#4fb3a8;
    --mono:"Cascadia Code",Consolas,monospace; --sans:"Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px}
  #top{display:flex;align-items:baseline;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#0d120f,#0b0f0d)}
  #top h1{font-family:var(--mono);font-size:18px;margin:0;color:var(--accent);letter-spacing:.08em}
  #top h1 .sub{color:var(--dim);font-size:11px;margin-left:8px;letter-spacing:.02em}
  #state{font-family:var(--mono);font-size:11px;color:var(--dim)}
  #state .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);margin-right:5px}
  #state.ok .dot{background:var(--ok)} #state.deg .dot{background:var(--warn)} #state.down .dot{background:var(--bad)}
  #summary{padding:10px 18px 0;font-family:var(--mono);font-size:11px;color:var(--dim)}
  #summary b{color:var(--fg);font-weight:700}
  .wrap{padding:10px 18px 20px}
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
  th{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);
    text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel2)}
  td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13px}
  tr:last-child td{border-bottom:none}
  td.mono{font-family:var(--mono);font-size:11px;color:var(--dim);word-break:break-all}
  td.name{font-family:var(--mono);font-size:12px;color:var(--fg)}
  tr.dark td{color:var(--faint)}
  .pill{display:inline-block;padding:1px 7px;border-radius:10px;font-size:10px;font-family:var(--mono);
    border:1px solid var(--line)}
  .pill.ok{color:var(--ok);border-color:#1f4a34}
  .pill.warn{color:var(--warn);border-color:#4a3d1f}
  .pill.bad{color:var(--bad);border-color:#4a1f1f}
  .pill.stale{color:var(--warn);border-color:#4a3d1f}
  .muted{color:var(--faint);font-family:var(--mono);font-size:10px}
  .err{color:var(--bad);font-family:var(--mono);font-size:11px}
  .btn{border:1px solid var(--line);background:var(--panel2);color:var(--fg);font-family:var(--mono);
    font-size:11px;padding:3px 9px;border-radius:4px;cursor:pointer;margin-left:6px}
  .btn:hover{border-color:var(--accent)}
  #rawToggle{margin-top:10px}
  #raw{margin-top:8px;max-height:320px;overflow:auto;display:none}
  #raw pre{font-family:var(--mono);font-size:10px;color:var(--dim);white-space:pre-wrap}
</style>
</head>
<body>
<div id="top">
  <h1>SIGMA FLEET<span class="sub">one row per lung · beats, not probes</span></h1>
  <span id="state"><span class="dot"></span><span id="stateTxt">connecting…</span></span>
  <div style="flex:1"></div>
  <button class="btn" id="refresh">↻ refresh</button>
  <button class="btn" id="goFleet">seats</button>
  <button class="btn" id="goHome">home</button>
</div>
<div id="summary">loading…</div>
<div class="wrap">
  <table>
    <thead>
      <tr>
        <th>lung</th><th>status</th><th>last beat</th><th>tailnet</th><th>ollama</th>
        <th>models</th><th>disk free</th><th>RAM</th><th>proof</th>
      </tr>
    </thead>
    <tbody id="rows"><tr><td colspan="9" class="muted">loading…</td></tr></tbody>
  </table>
  <div id="rawToggle"><button class="btn" id="toggleRaw">raw json</button>
    <span class="muted">the page never probes a lung; it renders the coordinator ledger only</span></div>
  <div id="raw"><pre></pre></div>
</div>
<script>
const $ = (s)=>document.querySelector(s);

function ageTxt(min){
  if (min == null) return 'never';
  if (min < 1) return Math.round(min*60) + 's ago';
  if (min < 120) return Math.round(min) + ' min ago';
  return (min/60).toFixed(1) + ' h ago';
}

function render(d){
  const s = d.summary || {};
  const counts = (s.lungs||0) + ' lung' + ((s.lungs===1)?'':'s')
    + ' · ' + (s.alive||0) + ' alive · ' + (s.warn||0) + ' warn · ' + (s.dark||0) + ' dark';
  $('#summary').innerHTML = '<b>' + esc(counts) + '</b> · beat ' + esc(d.beat_minutes) + ' min'
    + ' · dark after ' + esc(d.dark_after_minutes) + ' min'
    + ' · proof stale after ' + esc(d.proof_stale_minutes) + ' min'
    + ' · view built ' + esc(d.generated_at)
    + (d.ledger_truncated ? ' · <span class="pill warn">ledger tail truncated</span>' : '');
  const allAlive = (s.dark||0)===0 && (s.warn||0)===0 && (s.lungs||0) > 0;
  const anyAlive = (s.alive||0) > 0;
  $('#stateTxt').textContent = counts;
  $('#state').className = allAlive ? 'ok' : (anyAlive ? 'deg' : 'down');

  const tb = $('#rows');
  tb.innerHTML = '';
  const lungs = d.lungs || [];
  if (!lungs.length){
    tb.innerHTML = '<tr><td colspan="9" class="muted">empty fleet: no heartbeat ledger and no enrolled ollama-* lungs</td></tr>';
    return;
  }
  for (const l of lungs){
    const tr = document.createElement('tr');
    if (l.status === 'dark') tr.className = 'dark';
    const models = (l.models || []);
    const modelsTxt = models.length ? models.length + ': ' + models.join(', ') : 'none';
    const proof = l.proof;
    let proofTxt = '<span class="muted">none</span>';
    if (proof){
      const stale = proof.stale ? ' <span class="pill stale">stale</span>' : '';
      proofTxt = (proof.ok
        ? '<span class="pill ok">ok</span> ' + esc(proof.seconds) + 's' + (proof.model ? ' · ' + esc(proof.model) : '')
        : '<span class="pill bad">fail</span> ' + esc(proof.error || 'not demonstrated'))
        + ' · ' + ageTxt(proof.age_min) + stale;
    }
    const note = l.note ? ' <span class="muted">(' + esc(l.note) + ')</span>' : '';
    tr.innerHTML =
      '<td class="name">' + esc(l.host) + note + '</td>' +
      '<td><span class="pill ' + (l.status==='alive'?'ok':(l.status==='warn'?'warn':'bad')) + '">' + esc(l.status) + '</span></td>' +
      '<td class="mono">' + ageTxt(l.last_seen_age_min) + '</td>' +
      '<td class="mono">' + esc(l.tailscale_ip || '?') + '</td>' +
      '<td class="mono">' + esc(l.ollama_version || '?') + '</td>' +
      '<td class="mono">' + esc(modelsTxt) + '</td>' +
      '<td class="mono">' + (l.disk_free_gb == null ? '?' : esc(l.disk_free_gb) + 'G') + '</td>' +
      '<td class="mono">' + esc(l.mem_total || '?') + '</td>' +
      '<td class="mono">' + proofTxt + '</td>';
    tb.appendChild(tr);
  }
}

async function load(){
  try{
    const r = await fetch('/api/v1/sigma/fleet');
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
    render(d);
    $('#raw pre').textContent = JSON.stringify(d, null, 2);
  }catch(e){
    $('#stateTxt').textContent = 'error';
    $('#state').className = 'down';
    $('#summary').innerHTML = '<span class="err">' + esc(e.message) + '</span>';
  }
}

function esc(s){ return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

$('#refresh').onclick = load;
$('#goHome').onclick = ()=> location.href='/';
$('#goFleet').onclick = ()=> location.href='/fleet';
$('#toggleRaw').onclick = ()=>{ const el=$('#raw'); el.style.display = el.style.display==='block' ? 'none' : 'block'; };
load();
setInterval(load, 60000);
</script>
<script src="/static/nav.js"></script></body>
</html>
